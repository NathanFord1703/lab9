name: Basic Tests

on:
  push:
    branches:
      - main
      - test

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test 1 - Valid Input
        run: |
          output=$(python3 validate-data.py Nathan 0871234567)
          test "$output" = "PASS"

      - name: Test 2 - Name Too Long
        run: |
          output=$(python3 validate-data.py VeryLongStudentName 0871234567)
          test "$output" = "FAIL"

      - name: Test 3 - Mobile Too Long
        run: |
          output=$(python3 validate-data.py Nathan 087123456789)
          test "$output" = "FAIL"
