name: Basic Tests

on:
  push:
    branches:
      - main
      - test

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run and verify output
        run: |

          OUTPUT=$(python3 validate-data.py "pearse mccarthy" "0831122334")
          echo "Script output was: $OUTPUT"
          if [ "$OUTPUT" = "PASS" ]; then
            echo "Test Passed!"
          else
            echo "Test Failed!"
            exit 1
          fi

          OUTPUT=$(python3 validate-data.py "averyveryverylongname" "0831122334")
          echo "Script output was: $OUTPUT"
          if [ "$OUTPUT" = "FAIL" ]; then
            echo "Test Passed!"
          else
            echo "Test Failed!"
            exit 1
          fi

          OUTPUT=$(python3 validate-data.py "pearse mccarthy" "083112233445")
          echo "Script output was: $OUTPUT"
          if [ "$OUTPUT" = "FAIL" ]; then
            echo "Test Passed!"
          else
            echo "Test Failed!"
            exit 1
          fi
